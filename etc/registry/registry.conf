# global configuration
# chmod 700 /etc/registry
# chown epp:epp /etc/registry
# chmod 440 /etc/registry/registry.conf
# chown epp:epp /etc/registry/registry.conf

repository = <EPP_SERVER_REPOSITORY>
svID = <EPP_SERVER_ID>
mysql_database = registry
mysql_host =  <MYSQL_HOST>
mysql_port = 3306
mysql_username = <MYSQL_USER>
mysql_password = <MYSQL_PASSWORD>
zone_ns1 = <ZONE_NS1>
zone_ns2 = <ZONE_NS2>
transfer_lock_days = <TRANSFER_LOCK_DAYS>
transfer_waiting_minutes = <TRANSFER_WAITING_MINUTES>
rgp_add_period_minutes = <RGP_ADD_PERIOD_MINUTES>
rgp_renew_period_minutes = <RGP_RENEW_PERIOD_MINUTES>
rgp_transfer_period_minutes = <RGP_TRANSFER_PERIOD_MINUTES>
rgp_auto_renew_period_minutes = <RGP_AUTO_RENEW_PERIOD_MINUTES>
rgp_expiry_grace_minutes = <RGP_EXPIRY_GRACE_MINUTES>
rgp_redemption_period_minutes = <RGP_REDEMPTION_PERIOD_MINUTES>
rgp_pending_restore_minutes = <RGP_PENDING_RESTORE_MINUTES>
rgp_pending_delete_minutes = <RGP_PENDING_DELETE_MINUTES>
