ServerName epp.localhost

LoadModule epp_module modules/mod_epp.so

AcceptFilter epp none
Listen 700 epp
Listen 743 epp

# Enable CGI execution for the EPP scripts.
<Directory /var/www/cgi-bin/epp>
	Options ExecCGI
	SetHandler cgi-script
</Directory>

<VirtualHost *:700>
    Include epp_server_common.conf
</VirtualHost>

<VirtualHost *:743>
    Include epp_server_common.conf

    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLCertificateFile /etc/pki/tls/epp/server.crt
    SSLCertificateKeyFile /etc/pki/tls/epp/server.key
</VirtualHost>
